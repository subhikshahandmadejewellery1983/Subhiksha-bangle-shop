<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="65%" stop-color="#FCF8EB"/>
      <stop offset="100%" stop-color="#EDE2C2"/>
    </radialGradient>

    <!-- Mustard Haldi Silk Gradient -->
    <linearGradient id="mustardSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6207"/>
      <stop offset="25%" stop-color="#BF880B"/>
      <stop offset="45%" stop-color="#E5A715"/>
      <stop offset="55%" stop-color="#FFC533"/>
      <stop offset="70%" stop-color="#D4990E"/>
      <stop offset="100%" stop-color="#6B4803"/>
    </linearGradient>

    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C7A28"/>
      <stop offset="20%" stop-color="#E4C158"/>
      <stop offset="40%" stop-color="#FFF3A8"/>
      <stop offset="60%" stop-color="#D4A017"/>
      <stop offset="85%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#6E4D0C"/>
    </linearGradient>

    <pattern id="threadTextureMustard" width="4" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFF7D6" stroke-width="0.75" stroke-opacity="0.38"/>
      <line x1="2" y1="0" x2="2" y2="20" stroke="#4A3403" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <filter id="softShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3D2B03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad5)"/>
  <ellipse cx="400" cy="540" rx="330" ry="160" fill="#EFE5C6" opacity="0.7"/>
  <ellipse cx="400" cy="550" rx="250" ry="75" fill="#3D2C04" opacity="0.3" filter="url(#softShadow5)"/>

  <!-- 12-PIECE HALDI MUSTARD STACK -->
  <g id="haldiStack" transform="translate(0, -25)">
    <ellipse cx="400" cy="365" rx="220" ry="70" fill="#3D2903" stroke="#755208" stroke-width="4"/>
    
    <path d="M 180,365 C 180,455 620,455 620,365 L 620,485 C 620,575 180,575 180,485 Z" fill="url(#mustardSilkGrad)"/>
    <path d="M 180,365 C 180,455 620,455 620,365 L 620,485 C 620,575 180,575 180,485 Z" fill="url(#threadTextureMustard)"/>

    <path d="M 230,440 C 290,520 450,545 570,470" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity="0.35"/>
    <path d="M 290,470 C 350,535 440,540 510,495" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <!-- Gota Patti Metallic Ribbons -->
    <path d="M 180,380 C 180,470 620,470 620,380" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="4,4"/>
    <path d="M 180,400 C 180,490 620,490 620,400" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="4,4"/>
    <path d="M 180,420 C 180,510 620,510 620,420" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="4,4"/>
    <path d="M 180,440 C 180,530 620,530 620,440" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="4,4"/>
    <path d="M 180,460 C 180,550 620,550 620,460" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Top & Bottom Heavy Rims -->
    <path d="M 180,365 C 180,455 620,455 620,365" fill="none" stroke="url(#gold24k)" stroke-width="6"/>
    <path d="M 180,485 C 180,575 620,575 620,485" fill="none" stroke="url(#gold24k)" stroke-width="6"/>

    <!-- GOTA PATTI GOLD ROSETTES ON FRONT -->
    <g id="gotaRosettes">
      <g transform="translate(400, 480)">
        <polygon points="-12,-8 -4,-14 4,-14 12,-8 14,0 12,8 4,14 -4,14 -12,8 -14,0" fill="url(#gold24k)"/>
        <circle cx="0" cy="0" r="5" fill="#FFEAA7"/>
        <circle cx="0" cy="0" r="2" fill="#D4990E"/>
      </g>
      <g transform="translate(320, 460)">
        <polygon points="-10,-6 -3,-12 3,-12 10,-6 12,0 10,6 3,12 -3,12 -10,6 -12,0" fill="url(#gold24k)"/>
        <circle cx="0" cy="0" r="4" fill="#FFEAA7"/>
      </g>
      <g transform="translate(480, 460)">
        <polygon points="-10,-6 -3,-12 3,-12 10,-6 12,0 10,6 3,12 -3,12 -10,6 -12,0" fill="url(#gold24k)"/>
        <circle cx="0" cy="0" r="4" fill="#FFEAA7"/>
      </g>
    </g>
  </g>

  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#EDE2C2" stroke-width="1.5" filter="url(#softShadow5)"/>
    <circle cx="-160" cy="0" r="7" fill="#D4A017"/>
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#6B4803" letter-spacing="3" text-anchor="middle">
      SET OF 12 HALDI MUSTARD SILK BANGLES
    </text>
  </g>
</svg>
