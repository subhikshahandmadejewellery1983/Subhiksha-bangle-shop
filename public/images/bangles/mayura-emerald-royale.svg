<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background: Botanical Green Soft Bokeh & White Marble Surface -->
    <radialGradient id="gardenBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EBF4EE"/>
      <stop offset="45%" stop-color="#C2DCce"/>
      <stop offset="75%" stop-color="#7A9A8B"/>
      <stop offset="100%" stop-color="#3D5A4C"/>
    </radialGradient>

    <!-- White Polished Italian Marble Pedestal -->
    <linearGradient id="marblePedestal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F7F7F7"/>
      <stop offset="70%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>

    <!-- Deep Royal Emerald Silk Thread -->
    <linearGradient id="emeraldSilk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#052E23"/>
      <stop offset="25%" stop-color="#0E5E47"/>
      <stop offset="50%" stop-color="#1DB88A"/>
      <stop offset="75%" stop-color="#0E5E47"/>
      <stop offset="100%" stop-color="#042018"/>
    </linearGradient>

    <!-- Emerald Leaf Marquise Stones -->
    <linearGradient id="emeraldGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#053326"/>
      <stop offset="35%" stop-color="#107C5F"/>
      <stop offset="65%" stop-color="#2EE6A8"/>
      <stop offset="90%" stop-color="#0F664E"/>
      <stop offset="100%" stop-color="#032018"/>
    </linearGradient>

    <!-- 22K Royal Gold Prongs & Spacers -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A671A"/>
      <stop offset="25%" stop-color="#DFB33E"/>
      <stop offset="50%" stop-color="#FFF5B8"/>
      <stop offset="75%" stop-color="#C99824"/>
      <stop offset="100%" stop-color="#6B4B0A"/>
    </linearGradient>

    <!-- Brilliant Cut White Crystal Rhinestones -->
    <radialGradient id="crystalShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#B2D0E5"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="emeraldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#052E23" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#gardenBg)"/>

  <!-- Marble Surface Base -->
  <ellipse cx="400" cy="650" rx="380" ry="120" fill="url(#marblePedestal)"/>
  <ellipse cx="400" cy="540" rx="320" ry="40" fill="#000000" opacity="0.18" filter="blur(6px)"/>

  <!-- Bangle Stack Group (Front-Facing Symmetry matching green.webp) -->
  <g id="emeraldBangleStack" filter="url(#emeraldShadow)" transform="translate(160, 160)">

    <!-- 1. LEFTMOST KADA: Leaf-shaped Emerald Gemstones with Crystal Edging -->
    <g id="leftEmeraldKada" transform="translate(0, 0)">
      <!-- Base Core -->
      <rect x="15" y="80" width="85" height="360" rx="10" fill="url(#royalGold)"/>
      
      <!-- Leaf Prongs Rows -->
      <!-- Left Leaf Row -->
      <g fill="url(#emeraldGem)" stroke="url(#royalGold)" stroke-width="1.5">
        <path d="M 22,110 C 22,95 40,95 40,110 C 40,125 22,125 22,110 Z"/>
        <path d="M 22,145 C 22,130 40,130 40,145 C 40,160 22,160 22,145 Z"/>
        <path d="M 22,180 C 22,165 40,165 40,180 C 40,195 22,195 22,180 Z"/>
        <path d="M 22,215 C 22,200 40,200 40,215 C 40,230 22,230 22,215 Z"/>
        <path d="M 22,250 C 22,235 40,235 40,250 C 40,265 22,265 22,250 Z"/>
        <path d="M 22,285 C 22,270 40,270 40,285 C 40,300 22,300 22,285 Z"/>
        <path d="M 22,320 C 22,305 40,305 40,320 C 40,335 22,335 22,320 Z"/>
        <path d="M 22,355 C 22,340 40,340 40,355 C 40,370 22,370 22,355 Z"/>
        <path d="M 22,390 C 22,375 40,375 40,390 C 40,405 22,405 22,390 Z"/>
      </g>

      <!-- Central Sparkling Crystal Rhinestone Line -->
      <g fill="url(#crystalShine)" stroke="#A0C0D0" stroke-width="1">
        <circle cx="58" cy="100" r="4.5"/>
        <circle cx="58" cy="120" r="4.5"/>
        <circle cx="58" cy="140" r="4.5"/>
        <circle cx="58" cy="160" r="4.5"/>
        <circle cx="58" cy="180" r="4.5"/>
        <circle cx="58" cy="200" r="4.5"/>
        <circle cx="58" cy="220" r="4.5"/>
        <circle cx="58" cy="240" r="4.5"/>
        <circle cx="58" cy="260" r="4.5"/>
        <circle cx="58" cy="280" r="4.5"/>
        <circle cx="58" cy="300" r="4.5"/>
        <circle cx="58" cy="320" r="4.5"/>
        <circle cx="58" cy="340" r="4.5"/>
        <circle cx="58" cy="360" r="4.5"/>
        <circle cx="58" cy="380" r="4.5"/>
        <circle cx="58" cy="400" r="4.5"/>
        <circle cx="58" cy="420" r="4.5"/>
      </g>

      <!-- Right Leaf Row -->
      <g fill="url(#emeraldGem)" stroke="url(#royalGold)" stroke-width="1.5">
        <path d="M 76,110 C 76,95 94,95 94,110 C 94,125 76,125 76,110 Z"/>
        <path d="M 76,145 C 76,130 94,130 94,145 C 94,160 76,160 76,145 Z"/>
        <path d="M 76,180 C 76,165 94,165 94,180 C 94,195 76,195 76,180 Z"/>
        <path d="M 76,215 C 76,200 94,200 94,215 C 94,230 76,230 76,215 Z"/>
        <path d="M 76,250 C 76,235 94,235 94,250 C 94,265 76,265 76,250 Z"/>
        <path d="M 76,285 C 76,270 94,270 94,285 C 94,300 76,300 76,285 Z"/>
        <path d="M 76,320 C 76,305 94,305 94,320 C 94,335 76,335 76,320 Z"/>
        <path d="M 76,355 C 76,340 94,340 94,355 C 94,370 76,370 76,355 Z"/>
        <path d="M 76,390 C 76,375 94,375 94,390 C 94,405 76,405 76,390 Z"/>
      </g>
    </g>

    <!-- 2. Square Cut Antique Gold Spacer Bangle (Left) -->
    <g id="leftGoldSpacer" transform="translate(108, 0)">
      <rect x="0" y="85" width="30" height="350" rx="4" fill="url(#royalGold)"/>
      <g fill="#FFF5B8" stroke="#8A671A" stroke-width="1">
        <rect x="4" y="100" width="22" height="18" rx="2"/>
        <rect x="4" y="130" width="22" height="18" rx="2"/>
        <rect x="4" y="160" width="22" height="18" rx="2"/>
        <rect x="4" y="190" width="22" height="18" rx="2"/>
        <rect x="4" y="220" width="22" height="18" rx="2"/>
        <rect x="4" y="250" width="22" height="18" rx="2"/>
        <rect x="4" y="280" width="22" height="18" rx="2"/>
        <rect x="4" y="310" width="22" height="18" rx="2"/>
        <rect x="4" y="340" width="22" height="18" rx="2"/>
        <rect x="4" y="370" width="22" height="18" rx="2"/>
        <rect x="4" y="400" width="22" height="18" rx="2"/>
      </g>
    </g>

    <!-- 3. CENTRAL WIDE EMERALD SILK KADA with Floral Golden Garland -->
    <g id="centerEmeraldWideKada" transform="translate(145, 0)">
      <!-- Pure Royal Emerald Silk Thread Base -->
      <rect x="0" y="75" width="190" height="370" rx="14" fill="url(#emeraldSilk)"/>
      <!-- Gold Zari Outer Edges -->
      <line x1="5" y1="80" x2="5" y2="440" stroke="url(#royalGold)" stroke-width="6"/>
      <line x1="185" y1="80" x2="185" y2="440" stroke="url(#royalGold)" stroke-width="6"/>

      <!-- Vertical Golden Floral Garland Running Down Center -->
      <g id="centerFloralGarland" transform="translate(95, 90)">
        <!-- Floral Medallions stacked vertically -->
        <g stroke="url(#royalGold)" stroke-width="1.5">
          <!-- Flower 1 -->
          <circle cx="0" cy="30" r="10" fill="url(#royalGold)"/>
          <circle cx="0" cy="30" r="5" fill="url(#crystalShine)"/>
          <path d="M -16,30 C -22,22 -22,38 -16,30 Z" fill="url(#emeraldGem)"/>
          <path d="M 16,30 C 22,22 22,38 16,30 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,14 C -8,8 8,8 0,14 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,46 C -8,52 8,52 0,46 Z" fill="url(#emeraldGem)"/>

          <!-- Flower 2 -->
          <circle cx="0" cy="90" r="10" fill="url(#royalGold)"/>
          <circle cx="0" cy="90" r="5" fill="url(#crystalShine)"/>
          <path d="M -16,90 C -22,82 -22,98 -16,90 Z" fill="url(#emeraldGem)"/>
          <path d="M 16,90 C 22,82 22,98 16,90 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,74 C -8,68 8,68 0,74 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,106 C -8,112 8,112 0,106 Z" fill="url(#emeraldGem)"/>

          <!-- Flower 3 (Middle Main) -->
          <circle cx="0" cy="155" r="14" fill="url(#royalGold)"/>
          <circle cx="0" cy="155" r="7" fill="url(#crystalShine)"/>
          <path d="M -22,155 C -30,145 -30,165 -22,155 Z" fill="url(#emeraldGem)"/>
          <path d="M 22,155 C 30,145 30,165 22,155 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,133 C -10,125 10,125 0,133 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,177 C -10,185 10,185 0,177 Z" fill="url(#emeraldGem)"/>

          <!-- Flower 4 -->
          <circle cx="0" cy="225" r="10" fill="url(#royalGold)"/>
          <circle cx="0" cy="225" r="5" fill="url(#crystalShine)"/>
          <path d="M -16,225 C -22,217 -22,233 -16,225 Z" fill="url(#emeraldGem)"/>
          <path d="M 16,225 C 22,217 22,233 16,225 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,209 C -8,203 8,203 0,209 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,241 C -8,247 8,247 0,241 Z" fill="url(#emeraldGem)"/>

          <!-- Flower 5 -->
          <circle cx="0" cy="290" r="10" fill="url(#royalGold)"/>
          <circle cx="0" cy="290" r="5" fill="url(#crystalShine)"/>
          <path d="M -16,290 C -22,282 -22,298 -16,290 Z" fill="url(#emeraldGem)"/>
          <path d="M 16,290 C 22,282 22,298 16,290 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,274 C -8,268 8,268 0,274 Z" fill="url(#emeraldGem)"/>
          <path d="M 0,306 C -8,312 8,312 0,306 Z" fill="url(#emeraldGem)"/>
        </g>
      </g>
    </g>

    <!-- 4. Square Cut Antique Gold Spacer Bangle (Right) -->
    <g id="rightGoldSpacer" transform="translate(342, 0)">
      <rect x="0" y="85" width="30" height="350" rx="4" fill="url(#royalGold)"/>
      <g fill="#FFF5B8" stroke="#8A671A" stroke-width="1">
        <rect x="4" y="100" width="22" height="18" rx="2"/>
        <rect x="4" y="130" width="22" height="18" rx="2"/>
        <rect x="4" y="160" width="22" height="18" rx="2"/>
        <rect x="4" y="190" width="22" height="18" rx="2"/>
        <rect x="4" y="220" width="22" height="18" rx="2"/>
        <rect x="4" y="250" width="22" height="18" rx="2"/>
        <rect x="4" y="280" width="22" height="18" rx="2"/>
        <rect x="4" y="310" width="22" height="18" rx="2"/>
        <rect x="4" y="340" width="22" height="18" rx="2"/>
        <rect x="4" y="370" width="22" height="18" rx="2"/>
        <rect x="4" y="400" width="22" height="18" rx="2"/>
      </g>
    </g>

    <!-- 5. RIGHTMOST KADA: Leaf-shaped Emerald Gemstones with Crystal Edging -->
    <g id="rightEmeraldKada" transform="translate(380, 0)">
      <rect x="0" y="80" width="85" height="360" rx="10" fill="url(#royalGold)"/>
      <g fill="url(#emeraldGem)" stroke="url(#royalGold)" stroke-width="1.5">
        <path d="M 8,110 C 8,95 26,95 26,110 C 26,125 8,125 8,110 Z"/>
        <path d="M 8,145 C 8,130 26,130 26,145 C 26,160 8,160 8,145 Z"/>
        <path d="M 8,180 C 8,165 26,165 26,180 C 26,195 8,195 8,180 Z"/>
        <path d="M 8,215 C 8,200 26,200 26,215 C 26,230 8,230 8,215 Z"/>
        <path d="M 8,250 C 8,235 26,235 26,250 C 26,265 8,265 8,250 Z"/>
        <path d="M 8,285 C 8,270 26,270 26,285 C 26,300 8,300 8,285 Z"/>
        <path d="M 8,320 C 8,305 26,305 26,320 C 26,335 8,335 8,320 Z"/>
        <path d="M 8,355 C 8,340 26,340 26,355 C 26,370 8,370 8,355 Z"/>
        <path d="M 8,390 C 8,375 26,375 26,390 C 26,405 8,405 8,390 Z"/>
      </g>
      <g fill="url(#crystalShine)" stroke="#A0C0D0" stroke-width="1">
        <circle cx="44" cy="100" r="4.5"/>
        <circle cx="44" cy="120" r="4.5"/>
        <circle cx="44" cy="140" r="4.5"/>
        <circle cx="44" cy="160" r="4.5"/>
        <circle cx="44" cy="180" r="4.5"/>
        <circle cx="44" cy="200" r="4.5"/>
        <circle cx="44" cy="220" r="4.5"/>
        <circle cx="44" cy="240" r="4.5"/>
        <circle cx="44" cy="260" r="4.5"/>
        <circle cx="44" cy="280" r="4.5"/>
        <circle cx="44" cy="300" r="4.5"/>
        <circle cx="44" cy="320" r="4.5"/>
        <circle cx="44" cy="340" r="4.5"/>
        <circle cx="44" cy="360" r="4.5"/>
        <circle cx="44" cy="380" r="4.5"/>
        <circle cx="44" cy="400" r="4.5"/>
        <circle cx="44" cy="420" r="4.5"/>
      </g>
      <g fill="url(#emeraldGem)" stroke="url(#royalGold)" stroke-width="1.5">
        <path d="M 62,110 C 62,95 80,95 80,110 C 80,125 62,125 62,110 Z"/>
        <path d="M 62,145 C 62,130 80,130 80,145 C 80,160 62,160 62,145 Z"/>
        <path d="M 62,180 C 62,165 80,165 80,180 C 80,195 62,195 62,180 Z"/>
        <path d="M 62,215 C 62,200 80,200 80,215 C 80,230 62,230 62,215 Z"/>
        <path d="M 62,250 C 62,235 80,235 80,250 C 80,265 62,265 62,250 Z"/>
        <path d="M 62,285 C 62,270 80,270 80,285 C 80,300 62,300 62,285 Z"/>
        <path d="M 62,320 C 62,305 80,305 80,320 C 80,335 62,335 62,320 Z"/>
        <path d="M 62,355 C 62,340 80,340 80,355 C 80,370 62,370 62,355 Z"/>
        <path d="M 62,390 C 62,375 80,375 80,390 C 80,405 62,405 62,390 Z"/>
      </g>
    </g>

  </g>
</svg>
