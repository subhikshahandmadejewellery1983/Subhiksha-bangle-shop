<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="65%" stop-color="#F5F0E6"/>
      <stop offset="100%" stop-color="#E2D8C5"/>
    </radialGradient>

    <!-- Raw Silk Ivory Gradient -->
    <linearGradient id="ivorySilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7BCA6"/>
      <stop offset="25%" stop-color="#EBE2D0"/>
      <stop offset="45%" stop-color="#FAF5EC"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E4DAC6"/>
      <stop offset="100%" stop-color="#B3A48C"/>
    </linearGradient>

    <!-- Matte Antique Gold Gradient -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80621E"/>
      <stop offset="25%" stop-color="#C29F48"/>
      <stop offset="50%" stop-color="#E8D18C"/>
      <stop offset="75%" stop-color="#B89337"/>
      <stop offset="100%" stop-color="#5E430B"/>
    </linearGradient>

    <!-- Polki Mirror Glass -->
    <radialGradient id="polkiMirror" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFA"/>
      <stop offset="80%" stop-color="#DDE2E2"/>
      <stop offset="100%" stop-color="#BCC4C4"/>
    </radialGradient>

    <pattern id="threadTextureIvory" width="4" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.45"/>
      <line x1="2" y1="0" x2="2" y2="20" stroke="#94846B" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <filter id="softShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3D3425" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad4)"/>
  <ellipse cx="400" cy="540" rx="330" ry="160" fill="#ECE3D4" opacity="0.7"/>
  <ellipse cx="400" cy="550" rx="250" ry="75" fill="#362E20" opacity="0.3" filter="url(#softShadow4)"/>

  <!-- SET OF 4 BROAD IVORY & POLKI KADAS -->
  <g id="ivoryKadas" transform="translate(0, -25)">
    <!-- Back Hollow -->
    <ellipse cx="400" cy="370" rx="215" ry="68" fill="#3D3528" stroke="#7A6A4E" stroke-width="4"/>
    
    <!-- 4 Kadas Cylindrical Bodies -->
    <path d="M 185,370 C 185,465 615,465 615,370 L 615,480 C 615,575 185,575 185,480 Z" fill="url(#ivorySilkGrad)"/>
    <path d="M 185,370 C 185,465 615,465 615,370 L 615,480 C 615,575 185,575 185,480 Z" fill="url(#threadTextureIvory)"/>

    <!-- Silk Highlights -->
    <path d="M 235,445 C 295,520 445,540 565,475" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

    <!-- Antique Gold Zari Dividers between the 4 broad kadas -->
    <path d="M 185,398 C 185,493 615,493 615,398" fill="none" stroke="url(#antiqueGold)" stroke-width="4.5"/>
    <path d="M 185,426 C 185,521 615,521 615,426" fill="none" stroke="url(#antiqueGold)" stroke-width="4.5"/>
    <path d="M 185,454 C 185,549 615,549 615,454" fill="none" stroke="url(#antiqueGold)" stroke-width="4.5"/>

    <!-- Top & Bottom Heavy Rims -->
    <path d="M 185,370 C 185,465 615,465 615,370" fill="none" stroke="url(#antiqueGold)" stroke-width="6"/>
    <path d="M 185,480 C 185,575 615,575 615,480" fill="none" stroke="url(#antiqueGold)" stroke-width="6"/>

    <!-- UNCUT POLKI STONES IN RAISED ANTIQUE BRASS BEZELS -->
    <g id="polkiStones">
      <!-- Kada 1 (Center Row) -->
      <g transform="translate(400, 485)">
        <polygon points="-16,-12 0,-18 16,-12 20,8 0,16 -20,8" fill="url(#antiqueGold)" stroke="url(#antiqueGold)" stroke-width="2"/>
        <polygon points="-13,-10 0,-15 13,-10 16,6 0,13 -16,6" fill="url(#polkiMirror)"/>
        <polygon points="-5,-4 0,-7 6,-3 4,4 -2,6 -6,2" fill="#FFFFFF" opacity="0.8"/>
      </g>
      <g transform="translate(305, 465)">
        <polygon points="-14,-10 0,-15 14,-10 16,6 0,13 -16,6" fill="url(#antiqueGold)"/>
        <polygon points="-11,-8 0,-12 11,-8 13,4 0,10 -13,4" fill="url(#polkiMirror)"/>
      </g>
      <g transform="translate(495, 465)">
        <polygon points="-14,-10 0,-15 14,-10 16,6 0,13 -16,6" fill="url(#antiqueGold)"/>
        <polygon points="-11,-8 0,-12 11,-8 13,4 0,10 -13,4" fill="url(#polkiMirror)"/>
      </g>

      <!-- Kada 2 (Upper Row) -->
      <g transform="translate(400, 435)">
        <polygon points="-14,-10 0,-15 14,-10 16,6 0,13 -16,6" fill="url(#antiqueGold)"/>
        <polygon points="-11,-8 0,-12 11,-8 13,4 0,10 -13,4" fill="url(#polkiMirror)"/>
      </g>
      <g transform="translate(320, 420)">
        <circle cx="0" cy="0" r="10" fill="url(#antiqueGold)"/>
        <circle cx="0" cy="0" r="7.5" fill="url(#polkiMirror)"/>
      </g>
      <g transform="translate(480, 420)">
        <circle cx="0" cy="0" r="10" fill="url(#antiqueGold)"/>
        <circle cx="0" cy="0" r="7.5" fill="url(#polkiMirror)"/>
      </g>

      <!-- Kada 3 (Lower Row) -->
      <g transform="translate(400, 535)">
        <polygon points="-14,-10 0,-15 14,-10 16,6 0,13 -16,6" fill="url(#antiqueGold)"/>
        <polygon points="-11,-8 0,-12 11,-8 13,4 0,10 -13,4" fill="url(#polkiMirror)"/>
      </g>
      <g transform="translate(315, 510)">
        <circle cx="0" cy="0" r="9" fill="url(#antiqueGold)"/>
        <circle cx="0" cy="0" r="6.5" fill="url(#polkiMirror)"/>
      </g>
      <g transform="translate(485, 510)">
        <circle cx="0" cy="0" r="9" fill="url(#antiqueGold)"/>
        <circle cx="0" cy="0" r="6.5" fill="url(#polkiMirror)"/>
      </g>
    </g>
  </g>

  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2D8C5" stroke-width="1.5" filter="url(#softShadow4)"/>
    <circle cx="-160" cy="0" r="7" fill="#EBE2D0" stroke="#80621E" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#5E430B" letter-spacing="3" text-anchor="middle">
      SET OF 4 ANTIQUE IVORY &amp; POLKI KADAS
    </text>
  </g>
</svg>
