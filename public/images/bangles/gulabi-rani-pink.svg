<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="65%" stop-color="#FBF0F4"/>
      <stop offset="100%" stop-color="#ECD4DF"/>
    </radialGradient>

    <!-- Rani Pink Silk Thread Gradients -->
    <linearGradient id="raniSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880E4F"/>
      <stop offset="25%" stop-color="#AD1457"/>
      <stop offset="45%" stop-color="#E91E63"/>
      <stop offset="55%" stop-color="#FF4081"/>
      <stop offset="70%" stop-color="#C2185B"/>
      <stop offset="100%" stop-color="#560027"/>
    </linearGradient>

    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C7A28"/>
      <stop offset="20%" stop-color="#E4C158"/>
      <stop offset="40%" stop-color="#FFF3A8"/>
      <stop offset="60%" stop-color="#D4A017"/>
      <stop offset="85%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#6E4D0C"/>
    </linearGradient>

    <pattern id="threadTexturePink" width="4" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFD9EA" stroke-width="0.75" stroke-opacity="0.35"/>
      <line x1="2" y1="0" x2="2" y2="20" stroke="#3D001C" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <filter id="softShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4A0523" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad3)"/>
  <ellipse cx="400" cy="540" rx="330" ry="160" fill="#F4DEE7" opacity="0.7"/>
  <ellipse cx="400" cy="550" rx="250" ry="75" fill="#3D051C" opacity="0.3" filter="url(#softShadow3)"/>

  <!-- 12-PIECE RANI PINK FESTIVE STACK -->
  <g id="raniPinkStack" transform="translate(0, -25)">
    <!-- Inner Hollow -->
    <ellipse cx="400" cy="365" rx="220" ry="70" fill="#3D041D" stroke="#75083B" stroke-width="4"/>
    
    <!-- Stack of 12 Individual Silk Bangles -->
    <!-- Bangle 1 to 12 body arcs -->
    <path d="M 180,365 C 180,455 620,455 620,365 L 620,485 C 620,575 180,575 180,485 Z" fill="url(#raniSilkGrad)"/>
    <path d="M 180,365 C 180,455 620,455 620,365 L 620,485 C 620,575 180,575 180,485 Z" fill="url(#threadTexturePink)"/>

    <!-- Silk Highlights -->
    <path d="M 230,440 C 290,520 450,545 570,470" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity="0.32"/>
    <path d="M 290,470 C 350,535 440,540 510,495" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- Gold Temple Ball Chain Dividers for all 12 bangles -->
    <path d="M 180,375 C 180,465 620,465 620,375" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,385 C 180,475 620,475 620,385" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,395 C 180,485 620,485 620,395" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,405 C 180,495 620,495 620,405" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,415 C 180,505 620,505 620,415" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,425 C 180,515 620,515 620,425" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,435 C 180,525 620,525 620,435" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,445 C 180,535 620,535 620,445" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,455 C 180,545 620,545 620,455" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,465 C 180,555 620,555 620,465" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>
    <path d="M 180,475 C 180,565 620,565 620,475" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3,3"/>

    <!-- Top & Bottom Heavy Temple Borders with Ghungroo beads -->
    <path d="M 180,365 C 180,455 620,455 620,365" fill="none" stroke="url(#gold24k)" stroke-width="6"/>
    <path d="M 180,485 C 180,575 620,575 620,485" fill="none" stroke="url(#gold24k)" stroke-width="6"/>

    <!-- Micro Ghungroo Beads Row on bottom edge -->
    <g id="microGhungroos">
      <circle cx="205" cy="488" r="4" fill="url(#gold24k)"/>
      <circle cx="225" cy="505" r="4" fill="url(#gold24k)"/>
      <circle cx="250" cy="522" r="4" fill="url(#gold24k)"/>
      <circle cx="275" cy="537" r="4" fill="url(#gold24k)"/>
      <circle cx="305" cy="550" r="4" fill="url(#gold24k)"/>
      <circle cx="335" cy="560" r="4" fill="url(#gold24k)"/>
      <circle cx="365" cy="567" r="4" fill="url(#gold24k)"/>
      <circle cx="400" cy="570" r="4" fill="url(#gold24k)"/>
      <circle cx="435" cy="567" r="4" fill="url(#gold24k)"/>
      <circle cx="465" cy="560" r="4" fill="url(#gold24k)"/>
      <circle cx="495" cy="550" r="4" fill="url(#gold24k)"/>
      <circle cx="525" cy="537" r="4" fill="url(#gold24k)"/>
      <circle cx="550" cy="522" r="4" fill="url(#gold24k)"/>
      <circle cx="575" cy="505" r="4" fill="url(#gold24k)"/>
      <circle cx="595" cy="488" r="4" fill="url(#gold24k)"/>
    </g>
  </g>

  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#ECD4DF" stroke-width="1.5" filter="url(#softShadow3)"/>
    <circle cx="-160" cy="0" r="7" fill="#C2185B"/>
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#880E4F" letter-spacing="3" text-anchor="middle">
      SET OF 12 RANI PINK TEMPLE BANGLES
    </text>
  </g>
</svg>
