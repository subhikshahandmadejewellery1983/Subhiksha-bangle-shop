<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background: Luxury Jewelry Boutique Ambience -->
    <radialGradient id="boutiqueBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCF9F5"/>
      <stop offset="50%" stop-color="#F2EAE0"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </radialGradient>

    <!-- Crimson Velvet Display Stand Gradient -->
    <linearGradient id="velvetStand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A060E"/>
      <stop offset="25%" stop-color="#880E1C"/>
      <stop offset="55%" stop-color="#B2182B"/>
      <stop offset="85%" stop-color="#6F0914"/>
      <stop offset="100%" stop-color="#360309"/>
    </linearGradient>

    <!-- Turquoise Silk Thread Gradient -->
    <linearGradient id="turquoiseSilk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006D8A"/>
      <stop offset="25%" stop-color="#0096B7"/>
      <stop offset="50%" stop-color="#48CAE4"/>
      <stop offset="70%" stop-color="#00A8CC"/>
      <stop offset="100%" stop-color="#005B73"/>
    </linearGradient>

    <!-- Fine Silk Wrap Texture -->
    <pattern id="silkTexture" width="4" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.3"/>
      <line x1="2" y1="0" x2="2" y2="20" stroke="#003545" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <!-- Antique 24K Kasu Coin Gold -->
    <linearGradient id="kasuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C7722"/>
      <stop offset="20%" stop-color="#D9A833"/>
      <stop offset="45%" stop-color="#FFE885"/>
      <stop offset="65%" stop-color="#CFA02E"/>
      <stop offset="85%" stop-color="#8C6512"/>
      <stop offset="100%" stop-color="#5E4007"/>
    </linearGradient>

    <!-- Rani Pink Gemstone Gradient -->
    <linearGradient id="raniPinkGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880E4F"/>
      <stop offset="35%" stop-color="#C2185B"/>
      <stop offset="60%" stop-color="#FF4081"/>
      <stop offset="85%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#5A0530"/>
    </linearGradient>

    <!-- Turquoise Crystal Facet -->
    <linearGradient id="turqGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007791"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="bangleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2B0D05" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#boutiqueBg)"/>

  <!-- Velvet Display Rod (Horizontal) -->
  <g id="velvetStandRod">
    <ellipse cx="400" cy="580" rx="360" ry="45" fill="#1E0306" opacity="0.25" filter="blur(8px)"/>
    <rect x="50" y="340" width="700" height="120" rx="60" fill="url(#velvetStand)"/>
    <!-- Velvet Sheen Highlight -->
    <rect x="70" y="355" width="660" height="22" rx="11" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- Bangle Stack Group (Front-Facing Perspective) -->
  <g id="bangleAssembly" filter="url(#bangleShadow)" transform="translate(150, 160)">
    
    <!-- 1. LEFTMOST KADA: Antique Gold Kasu Coin Bangle -->
    <g id="leftKasuBangle" transform="translate(0, 0)">
      <rect x="20" y="100" width="55" height="320" rx="12" fill="url(#kasuGold)"/>
      <!-- Inner coin rim -->
      <line x1="28" y1="105" x2="28" y2="415" stroke="#5E4007" stroke-width="2"/>
      <line x1="68" y1="105" x2="68" y2="415" stroke="#5E4007" stroke-width="2"/>
      <!-- Embossed Kasu Coins -->
      <g fill="url(#kasuGold)" stroke="#6E4D0C" stroke-width="1.5">
        <circle cx="48" cy="130" r="16"/>
        <circle cx="48" cy="170" r="16"/>
        <circle cx="48" cy="210" r="16"/>
        <circle cx="48" cy="250" r="16"/>
        <circle cx="48" cy="290" r="16"/>
        <circle cx="48" cy="330" r="16"/>
        <circle cx="48" cy="370" r="16"/>
      </g>
      <!-- Coin center goddess engravings -->
      <g fill="#FFE885" opacity="0.9">
        <circle cx="48" cy="130" r="6"/>
        <circle cx="48" cy="170" r="6"/>
        <circle cx="48" cy="210" r="6"/>
        <circle cx="48" cy="250" r="6"/>
        <circle cx="48" cy="290" r="6"/>
        <circle cx="48" cy="330" r="6"/>
        <circle cx="48" cy="370" r="6"/>
      </g>
    </g>

    <!-- 2. Rani Pink Square Crystal Bangle (Left) -->
    <g id="leftPinkCrystalBangle" transform="translate(75, 0)">
      <rect x="10" y="105" width="40" height="310" rx="8" fill="url(#kasuGold)"/>
      <!-- Square Cut Rani Pink Stones -->
      <g fill="url(#raniPinkGem)" stroke="#FFE885" stroke-width="1.5">
        <rect x="18" y="125" width="24" height="22" rx="3"/>
        <rect x="18" y="160" width="24" height="22" rx="3"/>
        <rect x="18" y="195" width="24" height="22" rx="3"/>
        <rect x="18" y="230" width="24" height="22" rx="3"/>
        <rect x="18" y="265" width="24" height="22" rx="3"/>
        <rect x="18" y="300" width="24" height="22" rx="3"/>
        <rect x="18" y="335" width="24" height="22" rx="3"/>
        <rect x="18" y="370" width="24" height="22" rx="3"/>
      </g>
    </g>

    <!-- 3. CENTRAL SILK THREAD STATEMENT BANGLE (Turquoise with Starburst Gemstones) -->
    <g id="centerTurquoiseSilkStack" transform="translate(130, 0)">
      <!-- Pure Turquoise Mulberry Silk Core -->
      <rect x="0" y="95" width="180" height="330" rx="16" fill="url(#turquoiseSilk)"/>
      <rect x="0" y="95" width="180" height="330" rx="16" fill="url(#silkTexture)"/>
      <!-- Gold Zari Borders -->
      <line x1="6" y1="100" x2="6" y2="420" stroke="url(#kasuGold)" stroke-width="5"/>
      <line x1="174" y1="100" x2="174" y2="420" stroke="url(#kasuGold)" stroke-width="5"/>

      <!-- Center Ornate Floral Starburst Kundan Patterns -->
      <g id="starburstMotifs">
        <!-- Motif 1 (Top) -->
        <g transform="translate(90, 150)">
          <circle cx="0" cy="0" r="10" fill="url(#turqGem)" stroke="#FFE885" stroke-width="1.5"/>
          <!-- Starburst Petals (Pink and Gold) -->
          <polygon points="0,-28 -9,-14 9,-14" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <polygon points="0,28 -9,14 9,14" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <polygon points="-28,0 -14,-9 -14,9" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <polygon points="28,0 14,-9 14,9" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <!-- Diagonal Gold Accent Leaves -->
          <circle cx="-16" cy="-16" r="4.5" fill="url(#kasuGold)"/>
          <circle cx="16" cy="-16" r="4.5" fill="url(#kasuGold)"/>
          <circle cx="-16" cy="16" r="4.5" fill="url(#kasuGold)"/>
          <circle cx="16" cy="16" r="4.5" fill="url(#kasuGold)"/>
        </g>

        <!-- Motif 2 (Center) -->
        <g transform="translate(90, 260)">
          <circle cx="0" cy="0" r="14" fill="url(#turqGem)" stroke="#FFE885" stroke-width="2"/>
          <polygon points="0,-36 -12,-18 12,-18" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="2"/>
          <polygon points="0,36 -12,18 12,18" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="2"/>
          <polygon points="-36,0 -18,-12 -18,12" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="2"/>
          <polygon points="36,0 18,-12 18,12" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="2"/>
          <circle cx="-22" cy="-22" r="6" fill="url(#kasuGold)"/>
          <circle cx="22" cy="-22" r="6" fill="url(#kasuGold)"/>
          <circle cx="-22" cy="22" r="6" fill="url(#kasuGold)"/>
          <circle cx="22" cy="22" r="6" fill="url(#kasuGold)"/>
        </g>

        <!-- Motif 3 (Bottom) -->
        <g transform="translate(90, 370)">
          <circle cx="0" cy="0" r="10" fill="url(#turqGem)" stroke="#FFE885" stroke-width="1.5"/>
          <polygon points="0,-28 -9,-14 9,-14" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <polygon points="0,28 -9,14 9,14" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <polygon points="-28,0 -14,-9 -14,9" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <polygon points="28,0 14,-9 14,9" fill="url(#raniPinkGem)" stroke="url(#kasuGold)" stroke-width="1.5"/>
          <circle cx="-16" cy="-16" r="4.5" fill="url(#kasuGold)"/>
          <circle cx="16" cy="-16" r="4.5" fill="url(#kasuGold)"/>
          <circle cx="-16" cy="16" r="4.5" fill="url(#kasuGold)"/>
          <circle cx="16" cy="16" r="4.5" fill="url(#kasuGold)"/>
        </g>
      </g>
    </g>

    <!-- 4. Rani Pink Square Crystal Bangle (Right) -->
    <g id="rightPinkCrystalBangle" transform="translate(325, 0)">
      <rect x="0" y="105" width="40" height="310" rx="8" fill="url(#kasuGold)"/>
      <g fill="url(#raniPinkGem)" stroke="#FFE885" stroke-width="1.5">
        <rect x="8" y="125" width="24" height="22" rx="3"/>
        <rect x="8" y="160" width="24" height="22" rx="3"/>
        <rect x="8" y="195" width="24" height="22" rx="3"/>
        <rect x="8" y="230" width="24" height="22" rx="3"/>
        <rect x="8" y="265" width="24" height="22" rx="3"/>
        <rect x="8" y="300" width="24" height="22" rx="3"/>
        <rect x="8" y="335" width="24" height="22" rx="3"/>
        <rect x="8" y="370" width="24" height="22" rx="3"/>
      </g>
    </g>

    <!-- 5. RIGHTMOST KADA: Antique Gold Kasu Coin Bangle -->
    <g id="rightKasuBangle" transform="translate(380, 0)">
      <rect x="0" y="100" width="55" height="320" rx="12" fill="url(#kasuGold)"/>
      <line x1="8" y1="105" x2="8" y2="415" stroke="#5E4007" stroke-width="2"/>
      <line x1="48" y1="105" x2="48" y2="415" stroke="#5E4007" stroke-width="2"/>
      <g fill="url(#kasuGold)" stroke="#6E4D0C" stroke-width="1.5">
        <circle cx="28" cy="130" r="16"/>
        <circle cx="28" cy="170" r="16"/>
        <circle cx="28" cy="210" r="16"/>
        <circle cx="28" cy="250" r="16"/>
        <circle cx="28" cy="290" r="16"/>
        <circle cx="28" cy="330" r="16"/>
        <circle cx="28" cy="370" r="16"/>
      </g>
      <g fill="#FFE885" opacity="0.9">
        <circle cx="28" cy="130" r="6"/>
        <circle cx="28" cy="170" r="6"/>
        <circle cx="28" cy="210" r="6"/>
        <circle cx="28" cy="250" r="6"/>
        <circle cx="28" cy="290" r="6"/>
        <circle cx="28" cy="330" r="6"/>
        <circle cx="28" cy="370" r="6"/>
      </g>
    </g>

  </g>
</svg>
