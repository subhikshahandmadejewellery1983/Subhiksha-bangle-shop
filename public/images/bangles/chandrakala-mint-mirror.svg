<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad8" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="65%" stop-color="#F0F6F3"/>
      <stop offset="100%" stop-color="#D7E5DE"/>
    </radialGradient>

    <!-- Mint Sage Silk Gradient -->
    <linearGradient id="mintSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B695B"/>
      <stop offset="25%" stop-color="#678E7C"/>
      <stop offset="45%" stop-color="#8BB5A2"/>
      <stop offset="55%" stop-color="#A5CCBA"/>
      <stop offset="70%" stop-color="#769E8C"/>
      <stop offset="100%" stop-color="#3A5347"/>
    </linearGradient>

    <!-- Silver & White Gold Gradient -->
    <linearGradient id="silverZari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8B5B0"/>
      <stop offset="25%" stop-color="#E1EBE7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#CAD6D1"/>
      <stop offset="100%" stop-color="#80918B"/>
    </linearGradient>

    <!-- Circular Real Glass Mirror -->
    <radialGradient id="mirrorReflection" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E8F4F0"/>
      <stop offset="75%" stop-color="#C7DDD6"/>
      <stop offset="100%" stop-color="#9CB8AF"/>
    </radialGradient>

    <pattern id="threadTextureMint" width="4" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#E6F5EE" stroke-width="0.75" stroke-opacity="0.38"/>
      <line x1="2" y1="0" x2="2" y2="20" stroke="#364E43" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <filter id="softShadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2D4238" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad8)"/>
  <ellipse cx="400" cy="540" rx="330" ry="160" fill="#E1ECE7" opacity="0.7"/>
  <ellipse cx="400" cy="550" rx="250" ry="75" fill="#283C32" opacity="0.3" filter="url(#softShadow8)"/>

  <!-- 10-PIECE MINT SAGE MIRRORWORK STACK -->
  <g id="mintStack" transform="translate(0, -25)">
    <ellipse cx="400" cy="370" rx="215" ry="68" fill="#293D33" stroke="#507362" stroke-width="4"/>
    
    <path d="M 185,370 C 185,465 615,465 615,370 L 615,480 C 615,575 185,575 185,480 Z" fill="url(#mintSilkGrad)"/>
    <path d="M 185,370 C 185,465 615,465 615,370 L 615,480 C 615,575 185,575 185,480 Z" fill="url(#threadTextureMint)"/>

    <path d="M 235,445 C 295,520 445,540 565,475" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity="0.38"/>
    <path d="M 295,475 C 355,535 435,535 505,495" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Silver cord dividers -->
    <path d="M 185,395 C 185,490 615,490 615,395" fill="none" stroke="url(#silverZari)" stroke-width="3" stroke-dasharray="3,3"/>
    <path d="M 185,420 C 185,515 615,515 615,420" fill="none" stroke="url(#silverZari)" stroke-width="3" stroke-dasharray="3,3"/>
    <path d="M 185,445 C 185,540 615,540 615,445" fill="none" stroke="url(#silverZari)" stroke-width="3" stroke-dasharray="3,3"/>

    <!-- Top & Bottom Silver Rims -->
    <path d="M 185,370 C 185,465 615,465 615,370" fill="none" stroke="url(#silverZari)" stroke-width="6"/>
    <path d="M 185,480 C 185,575 615,575 615,480" fill="none" stroke="url(#silverZari)" stroke-width="6"/>

    <!-- CIRCULAR MIRRORS FRAMED IN THREAD LOOPS -->
    <g id="mirrors">
      <g transform="translate(400, 485)">
        <circle cx="0" cy="0" r="15" fill="url(#silverZari)"/>
        <circle cx="0" cy="0" r="12" fill="url(#mirrorReflection)"/>
        <path d="M -7,-5 L 3,-5 L -3,6 Z" fill="#FFFFFF" opacity="0.75"/>
      </g>
      <g transform="translate(325, 465)">
        <circle cx="0" cy="0" r="12" fill="url(#silverZari)"/>
        <circle cx="0" cy="0" r="9.5" fill="url(#mirrorReflection)"/>
        <path d="M -5,-3 L 2,-3 L -2,4 Z" fill="#FFFFFF" opacity="0.75"/>
      </g>
      <g transform="translate(475, 465)">
        <circle cx="0" cy="0" r="12" fill="url(#silverZari)"/>
        <circle cx="0" cy="0" r="9.5" fill="url(#mirrorReflection)"/>
        <path d="M -5,-3 L 2,-3 L -2,4 Z" fill="#FFFFFF" opacity="0.75"/>
      </g>
      <g transform="translate(260, 440)">
        <circle cx="0" cy="0" r="10" fill="url(#silverZari)"/>
        <circle cx="0" cy="0" r="7.5" fill="url(#mirrorReflection)"/>
      </g>
      <g transform="translate(540, 440)">
        <circle cx="0" cy="0" r="10" fill="url(#silverZari)"/>
        <circle cx="0" cy="0" r="7.5" fill="url(#mirrorReflection)"/>
      </g>
    </g>
  </g>

  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#D7E5DE" stroke-width="1.5" filter="url(#softShadow8)"/>
    <circle cx="-160" cy="0" r="7" fill="#7A9A8B"/>
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#3A5347" letter-spacing="3" text-anchor="middle">
      MINT SAGE SILK &amp; MIRRORWORK BANGLES
    </text>
  </g>
</svg>
