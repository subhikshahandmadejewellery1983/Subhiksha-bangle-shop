<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad9" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="65%" stop-color="#FCF5EB"/>
      <stop offset="100%" stop-color="#ECDDC6"/>
    </radialGradient>

    <!-- Amber Silk Gradient -->
    <linearGradient id="amberSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#803D00"/>
      <stop offset="25%" stop-color="#B35500"/>
      <stop offset="45%" stop-color="#D97706"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#B85D00"/>
      <stop offset="100%" stop-color="#5C2B00"/>
    </linearGradient>

    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C7A28"/>
      <stop offset="20%" stop-color="#E4C158"/>
      <stop offset="40%" stop-color="#FFF3A8"/>
      <stop offset="60%" stop-color="#D4A017"/>
      <stop offset="85%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#6E4D0C"/>
    </linearGradient>

    <linearGradient id="kundanGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFFDE8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#EADCB9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C2B280" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="threadTextureAmber" width="4" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFE9CC" stroke-width="0.75" stroke-opacity="0.35"/>
      <line x1="2" y1="0" x2="2" y2="20" stroke="#4A2200" stroke-width="0.75" stroke-opacity="0.38"/>
    </pattern>

    <filter id="softShadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#421E02" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad9)"/>
  <ellipse cx="400" cy="540" rx="330" ry="160" fill="#EFE2CD" opacity="0.7"/>
  <ellipse cx="400" cy="550" rx="250" ry="75" fill="#3D1D03" opacity="0.3" filter="url(#softShadow9)"/>

  <!-- PAIR OF 2 AMBER STATEMENT KADAS -->
  <g id="amberKadas" transform="translate(0, -20)">
    <!-- Back Kada -->
    <g transform="translate(-40, -35) rotate(-5 360 430)" opacity="0.95">
      <ellipse cx="370" cy="380" rx="195" ry="60" fill="#2E1500" stroke="#7A3900" stroke-width="4"/>
      <path d="M 175,380 C 175,475 565,475 565,380 L 565,455 C 565,550 175,550 175,455 Z" fill="url(#amberSilkGrad)"/>
      <path d="M 175,380 C 175,475 565,475 565,380 L 565,455 C 565,550 175,550 175,455 Z" fill="url(#threadTextureAmber)"/>
      <path d="M 175,380 C 175,475 565,475 565,380" fill="none" stroke="url(#gold24k)" stroke-width="5"/>
      <path d="M 175,455 C 175,550 565,550 565,455" fill="none" stroke="url(#gold24k)" stroke-width="5"/>
    </g>

    <!-- Front Kada -->
    <g id="frontAmberKada">
      <ellipse cx="430" cy="400" rx="205" ry="65" fill="#361902" stroke="#873F00" stroke-width="4"/>
      
      <path d="M 225,400 C 225,505 635,505 635,400 L 635,485 C 635,590 225,590 225,485 Z" fill="url(#amberSilkGrad)"/>
      <path d="M 225,400 C 225,505 635,505 635,400 L 635,485 C 635,590 225,590 225,485 Z" fill="url(#threadTextureAmber)"/>

      <path d="M 270,455 C 330,520 450,540 560,480" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
      <path d="M 330,485 C 390,535 480,535 520,500" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

      <!-- Top and Bottom Rims -->
      <path d="M 225,400 C 225,505 635,505 635,400" fill="none" stroke="url(#gold24k)" stroke-width="7"/>
      <path d="M 225,485 C 225,590 635,590 635,485" fill="none" stroke="url(#gold24k)" stroke-width="7"/>

      <!-- Raised Jadau Kundan Medallion -->
      <g transform="translate(430, 495)">
        <polygon points="-24,-16 0,-26 24,-16 28,10 0,22 -28,10" fill="url(#gold24k)"/>
        <polygon points="-20,-13 0,-22 20,-13 23,8 0,18 -23,8" fill="#803D00"/>
        <circle cx="0" cy="0" r="12" fill="url(#kundanGlass)"/>
        <!-- Accent Kundan Petals -->
        <circle cx="0" cy="-14" r="5" fill="url(#kundanGlass)"/>
        <circle cx="15" cy="-5" r="5" fill="url(#kundanGlass)"/>
        <circle cx="12" cy="11" r="5" fill="url(#kundanGlass)"/>
        <circle cx="-12" cy="11" r="5" fill="url(#kundanGlass)"/>
        <circle cx="-15" cy="-5" r="5" fill="url(#kundanGlass)"/>
      </g>

      <g transform="translate(325, 475)">
        <circle cx="0" cy="0" r="16" fill="url(#gold24k)"/>
        <circle cx="0" cy="0" r="9" fill="url(#kundanGlass)"/>
      </g>
      <g transform="translate(535, 475)">
        <circle cx="0" cy="0" r="16" fill="url(#gold24k)"/>
        <circle cx="0" cy="0" r="9" fill="url(#kundanGlass)"/>
      </g>
    </g>
  </g>

  <g transform="translate(400, 720)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#ECDDC6" stroke-width="1.5" filter="url(#softShadow9)"/>
    <circle cx="-160" cy="0" r="7" fill="#D97706"/>
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#5C2B00" letter-spacing="3" text-anchor="middle">
      PAIR OF 2 SURYA AMBER KUNDAN KADAS
    </text>
  </g>
</svg>
