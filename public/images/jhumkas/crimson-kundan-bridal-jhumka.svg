    <path d="M-36,78 C-18,65 18,65 36,78 L45,95 C15,88 -15,88 -45,95 Z" fill="url(#bridalGoldChakri)"/>

    <path d="M-100,250 C-100,120 -65,95 0,95 C65,95 100,120 100,250 C65,268 -65,268 -100,250 Z" fill="url(#silkCrimsonGrad)"/>
    
    <path d="M-80,240 C-80,130 -50,102 0,96" fill="none" stroke="#B81A2A" stroke-width="1.6" opacity="0.6"/>
    <path d="M-55,252 C-55,138 -32,102 0,96" fill="none" stroke="#7A0A16" stroke-width="1.6" opacity="0.6"/>
    <path d="M-28,260 C-28,142 -15,102 0,96" fill="none" stroke="#E62C40" stroke-width="1.6" opacity="0.6"/>
    <path d="M0,262 L0,96" fill="none" stroke="#FF4D61" stroke-width="2" opacity="0.75"/>
    <path d="M28,260 C28,142 15,102 0,96" fill="none" stroke="#E62C40" stroke-width="1.6" opacity="0.6"/>
    <path d="M55,252 C55,138 32,102 0,96" fill="none" stroke="#7A0A16" stroke-width="1.6" opacity="0.6"/>
    <path d="M80,240 C80,130 50,102 0,96" fill="none" stroke="#B81A2A" stroke-width="1.6" opacity="0.6"/>

    <path d="M-88,190 Q0,212 88,190 Q0,200 -88,190 Z" fill="url(#bridalGoldChakri)"/>
    <circle cx="-55" cy="195" r="5" fill="url(#kundanFoil)"/>
    <circle cx="-28" cy="200" r="5" fill="url(#kundanFoil)"/>
    <circle cx="0" cy="202" r="6" fill="url(#kundanFoil)"/>
    <circle cx="28" cy="200" r="5" fill="url(#kundanFoil)"/>
    <circle cx="55" cy="195" r="5" fill="url(#kundanFoil)"/>

    <path d="M-100,250 Q0,270 100,250 Q0,260 -100,250 Z" fill="url(#bridalGoldChakri)"/>

    <g>
      <circle cx="-90" cy="268" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
      <circle cx="-70" cy="278" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
      <circle cx="-48" cy="285" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
      <circle cx="-25" cy="289" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
      <circle cx="0" cy="291" r="7.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1.2"/>
      <circle cx="25" cy="289" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
      <circle cx="48" cy="285" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
      <circle cx="70" cy="278" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
      <circle cx="90" cy="268" r="6.5" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1"/>
    </g>

    <line x1="0" y1="260" x2="0" y2="320" stroke="url(#bridalGoldChakri)" stroke-width="2.5"/>
    <circle cx="0" cy="310" r="5.5" fill="url(#bridalGoldChakri)"/>
    <circle cx="0" cy="330" r="10" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1.2"/>
  </g>
</svg>
