    <circle cx="0" cy="310" r="5.5" fill="url(#bridalGoldChakri)"/>
    <circle cx="0" cy="330" r="10" fill="url(#bridalPearl)" stroke="url(#bridalGoldChakri)" stroke-width="1.2"/>
  </g>

  <!-- Right Jhumka -->
  <g transform="translate(540, 230)" filter="url(#crimsonShadow)">
    <g>
      <circle cx="0" cy="0" r="46" fill="url(#silkCrimsonGrad)"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="url(#bridalGoldChakri)" stroke-width="2.5"/>
      <circle cx="0" cy="-24" r="8" fill="url(#kundanFoil)" stroke="url(#bridalGoldChakri)" stroke-width="1.5"/>
      <circle cx="21" cy="-12" r="8" fill="url(#kundanFoil)" stroke="url(#bridalGoldChakri)" stroke-width="1.5"/>
      <circle cx="21" cy="12" r="8" fill="url(#kundanFoil)" stroke="url(#bridalGoldChakri)" stroke-width="1.5"/>
      <circle cx="0" cy="24" r="8" fill="url(#kundanFoil)" stroke="url(#bridalGoldChakri)" stroke-width="1.5"/>
      <circle cx="-21" cy="12" r="8" fill="url(#kundanFoil)" stroke="url(#bridalGoldChakri)" stroke-width="1.5"/>
