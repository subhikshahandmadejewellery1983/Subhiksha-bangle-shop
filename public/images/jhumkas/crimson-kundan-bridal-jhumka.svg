<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bridalJhumkaBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FBF0E9"/>
      <stop offset="100%" stop-color="#DEC9B7"/>
    </radialGradient>
    <linearGradient id="silkCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#690915"/>
      <stop offset="25%" stop-color="#A81525"/>
      <stop offset="50%" stop-color="#E52C3E"/>
      <stop offset="75%" stop-color="#A81525"/>
      <stop offset="100%" stop-color="#690915"/>
    </linearGradient>
    <linearGradient id="bridalGoldChakri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#916B1C"/>
      <stop offset="35%" stop-color="#E8BF54"/>
      <stop offset="60%" stop-color="#FFF8C4"/>
      <stop offset="85%" stop-color="#D19E2B"/>
      <stop offset="100%" stop-color="#6B4B08"/>
    </linearGradient>
    <radialGradient id="bridalPearl" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#D1C6AF"/>
    </radialGradient>
    <radialGradient id="kundanFoil" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFEEF"/>
      <stop offset="100%" stop-color="#E3D7BA"/>
    </radialGradient>
    <filter id="crimsonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#300B10" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bridalJhumkaBg)"/>
  <ellipse cx="400" cy="690" rx="300" ry="50" fill="#CCAFA0" opacity="0.38"/>

  <!-- Left Jhumka -->
  <g transform="translate(260, 230)" filter="url(#crimsonShadow)">
