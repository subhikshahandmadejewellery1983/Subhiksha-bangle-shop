<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="peacockBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#EFF6F9"/>
      <stop offset="100%" stop-color="#CAD9E0"/>
    </radialGradient>
    <linearGradient id="silkBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08223B"/>
      <stop offset="30%" stop-color="#0F4C81"/>
      <stop offset="55%" stop-color="#1B75BC"/>
      <stop offset="80%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#08223B"/>
    </linearGradient>
    <linearGradient id="goldChand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F6A1E"/>
      <stop offset="35%" stop-color="#E5BA4E"/>
      <stop offset="60%" stop-color="#FFF5BD"/>
      <stop offset="85%" stop-color="#D19E2B"/>
      <stop offset="100%" stop-color="#694B0A"/>
    </linearGradient>
    <radialGradient id="chandPearl" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2EFE8"/>
      <stop offset="100%" stop-color="#C7BCA7"/>
    </radialGradient>
    <filter id="chandShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0A1824" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#peacockBg)"/>
  <ellipse cx="400" cy="690" rx="300" ry="50" fill="#B8C9D1" opacity="0.4"/>

  <!-- Left Chandbali Jhumka -->
  <g transform="translate(260, 220)" filter="url(#chandShadow)">
    <!-- Top Stud -->
    <circle cx="0" cy="0" r="38" fill="url(#silkBlueGrad)"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#goldChand)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="url(#goldChand)"/>
    <circle cx="0" cy="0" r="10" fill="url(#chandPearl)"/>

    <!-- Crescent Chandbali Ring -->
    <g transform="translate(0, 75)">
      <path d="M-60,0 C-60,50 60,50 60,0 C45,35 -45,35 -60,0 Z" fill="url(#silkBlueGrad)" stroke="url(#goldChand)" stroke-width="3"/>
      <!-- Crescent pearl beads -->
      <circle cx="-50" cy="18" r="5" fill="url(#chandPearl)"/>
      <circle cx="-25" cy="36" r="5" fill="url(#chandPearl)"/>
      <circle cx="0" cy="42" r="6" fill="url(#chandPearl)"/>
      <circle cx="25" cy="36" r="5" fill="url(#chandPearl)"/>
      <circle cx="50" cy="18" r="5" fill="url(#chandPearl)"/>
    </g>

    <!-- Hanging Bell Jhumka -->
    <g transform="translate(0, 130)">
      <path d="M-26,20 Q0,8 26,20 L32,32 Q0,26 -32,32 Z" fill="url(#goldChand)"/>
      <path d="M-80,150 C-80,45 -50,30 0,30 C50,30 80,45 80,150 C50,165 -50,165 -80,150 Z" fill="url(#silkBlueGrad)"/>
      
      <!-- Blue silk thread stripes -->
      <path d="M-60,140 C-60,55 -35,35 0,32" fill="none" stroke="#268DD6" stroke-width="1.6" opacity="0.6"/>
      <path d="M-35,148 C-35,60 -20,35 0,32" fill="none" stroke="#145A96" stroke-width="1.6" opacity="0.6"/>
      <path d="M0,152 L0,32" fill="none" stroke="#4AA5EB" stroke-width="2" opacity="0.75"/>
      <path d="M35,148 C35,60 20,35 0,32" fill="none" stroke="#145A96" stroke-width="1.6" opacity="0.6"/>
      <path d="M60,140 C60,55 35,35 0,32" fill="none" stroke="#268DD6" stroke-width="1.6" opacity="0.6"/>

      <!-- Lower Gold Rim & Pearls -->
      <path d="M-80,150 Q0,168 80,150 Q0,158 -80,150 Z" fill="url(#goldChand)"/>
      <g>
        <circle cx="-70" cy="164" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="-45" cy="172" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="-20" cy="176" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="0" cy="178" r="7" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="20" cy="176" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="45" cy="172" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="70" cy="164" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
      </g>
      <!-- Center drop -->
      <line x1="0" y1="160" x2="0" y2="210" stroke="url(#goldChand)" stroke-width="2"/>
      <circle cx="0" cy="216" r="8" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
    </g>
  </g>

  <!-- Right Chandbali Jhumka -->
  <g transform="translate(540, 220)" filter="url(#chandShadow)">
    <circle cx="0" cy="0" r="38" fill="url(#silkBlueGrad)"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#goldChand)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="url(#goldChand)"/>
    <circle cx="0" cy="0" r="10" fill="url(#chandPearl)"/>

    <g transform="translate(0, 75)">
      <path d="M-60,0 C-60,50 60,50 60,0 C45,35 -45,35 -60,0 Z" fill="url(#silkBlueGrad)" stroke="url(#goldChand)" stroke-width="3"/>
      <circle cx="-50" cy="18" r="5" fill="url(#chandPearl)"/>
      <circle cx="-25" cy="36" r="5" fill="url(#chandPearl)"/>
      <circle cx="0" cy="42" r="6" fill="url(#chandPearl)"/>
      <circle cx="25" cy="36" r="5" fill="url(#chandPearl)"/>
      <circle cx="50" cy="18" r="5" fill="url(#chandPearl)"/>
    </g>

    <g transform="translate(0, 130)">
      <path d="M-26,20 Q0,8 26,20 L32,32 Q0,26 -32,32 Z" fill="url(#goldChand)"/>
      <path d="M-80,150 C-80,45 -50,30 0,30 C50,30 80,45 80,150 C50,165 -50,165 -80,150 Z" fill="url(#silkBlueGrad)"/>
      
      <path d="M-60,140 C-60,55 -35,35 0,32" fill="none" stroke="#268DD6" stroke-width="1.6" opacity="0.6"/>
      <path d="M-35,148 C-35,60 -20,35 0,32" fill="none" stroke="#145A96" stroke-width="1.6" opacity="0.6"/>
      <path d="M0,152 L0,32" fill="none" stroke="#4AA5EB" stroke-width="2" opacity="0.75"/>
      <path d="M35,148 C35,60 20,35 0,32" fill="none" stroke="#145A96" stroke-width="1.6" opacity="0.6"/>
      <path d="M60,140 C60,55 35,35 0,32" fill="none" stroke="#268DD6" stroke-width="1.6" opacity="0.6"/>

      <path d="M-80,150 Q0,168 80,150 Q0,158 -80,150 Z" fill="url(#goldChand)"/>
      <g>
        <circle cx="-70" cy="164" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="-45" cy="172" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="-20" cy="176" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="0" cy="178" r="7" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="20" cy="176" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="45" cy="172" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
        <circle cx="70" cy="164" r="6" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
      </g>
      <line x1="0" y1="160" x2="0" y2="210" stroke="url(#goldChand)" stroke-width="2"/>
      <circle cx="0" cy="216" r="8" fill="url(#chandPearl)" stroke="url(#goldChand)" stroke-width="1"/>
    </g>
  </g>
</svg>
