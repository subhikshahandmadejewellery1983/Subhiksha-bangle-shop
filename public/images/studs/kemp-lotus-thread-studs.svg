<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="lotusBoutiqueBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#F7ECE0"/>
      <stop offset="100%" stop-color="#E2D0BE"/>
    </radialGradient>
    <linearGradient id="silkEmeraldLotus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032B20"/>
      <stop offset="40%" stop-color="#0E5E47"/>
      <stop offset="70%" stop-color="#19A87C"/>
      <stop offset="100%" stop-color="#053326"/>
    </linearGradient>
    <linearGradient id="kempRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88081A"/>
      <stop offset="50%" stop-color="#D61834"/>
      <stop offset="100%" stop-color="#6E0412"/>
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A87E26"/>
      <stop offset="40%" stop-color="#F5CF64"/>
      <stop offset="60%" stop-color="#FFF5BD"/>
      <stop offset="85%" stop-color="#D9A632"/>
      <stop offset="100%" stop-color="#785312"/>
    </linearGradient>
    <radialGradient id="pearlMini" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2EBDB"/>
      <stop offset="100%" stop-color="#C2B79D"/>
    </radialGradient>
    <filter id="lotusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#2D1B0D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#lotusBoutiqueBg)"/>
  <ellipse cx="400" cy="590" rx="280" ry="65" fill="#D3BFAB" opacity="0.35"/>

  <!-- Left Lotus Stud -->
  <g transform="translate(260, 390)" filter="url(#lotusShadow)">
    <circle cx="0" cy="0" r="110" fill="url(#silkEmeraldLotus)"/>
    <!-- Concentric Silk Woven Threads -->
    <circle cx="0" cy="0" r="102" fill="none" stroke="#16936E" stroke-width="1.6" stroke-dasharray="3,2" opacity="0.5"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#0E5E47" stroke-width="1.6" stroke-dasharray="3,2" opacity="0.5"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#19A87C" stroke-width="1.6" stroke-dasharray="4,2" opacity="0.5"/>
    
    <!-- 8 Lotus Flower Petals in Kemp Ruby -->
    <g>
      <path d="M0,-85 C15,-65 25,-40 0,-30 C-25,-40 -15,-65 0,-85 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M60,-60 C60,-35 45,-25 25,-15 C20,-38 38,-55 60,-60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M85,0 C65,15 40,25 30,0 C40,-25 65,-15 85,0 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M60,60 C35,60 25,45 15,25 C38,20 55,38 60,60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M0,85 C-15,65 -25,40 0,30 C25,40 15,65 0,85 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M-60,60 C-60,35 -45,25 -25,15 C-20,38 -38,55 -60,60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M-85,0 C-65,-15 -40,-25 -30,0 C-40,25 -65,15 -85,0 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M-60,-60 C-35,-60 -25,-45 -15,-25 C-38,-20 -55,-38 -60,-60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
    </g>

    <!-- Center Kundan Roundel -->
    <circle cx="0" cy="0" r="32" fill="url(#goldFiligree)"/>
    <circle cx="0" cy="0" r="26" fill="url(#pearlMini)"/>
    <circle cx="0" cy="0" r="14" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>

    <!-- Outer Gold Ball Chain Border -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="url(#goldFiligree)" stroke-width="5" stroke-dasharray="3,5"/>
  </g>

  <!-- Right Lotus Stud -->
  <g transform="translate(540, 390)" filter="url(#lotusShadow)">
    <circle cx="0" cy="0" r="110" fill="url(#silkEmeraldLotus)"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="#16936E" stroke-width="1.6" stroke-dasharray="3,2" opacity="0.5"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#0E5E47" stroke-width="1.6" stroke-dasharray="3,2" opacity="0.5"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#19A87C" stroke-width="1.6" stroke-dasharray="4,2" opacity="0.5"/>

    <!-- 8 Lotus Flower Petals in Kemp Ruby -->
    <g>
      <path d="M0,-85 C15,-65 25,-40 0,-30 C-25,-40 -15,-65 0,-85 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M60,-60 C60,-35 45,-25 25,-15 C20,-38 38,-55 60,-60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M85,0 C65,15 40,25 30,0 C40,-25 65,-15 85,0 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M60,60 C35,60 25,45 15,25 C38,20 55,38 60,60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M0,85 C-15,65 -25,40 0,30 C25,40 15,65 0,85 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M-60,60 C-60,35 -45,25 -25,15 C-20,38 -38,55 -60,60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M-85,0 C-65,-15 -40,-25 -30,0 C-40,25 -65,15 -85,0 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
      <path d="M-60,-60 C-35,-60 -25,-45 -15,-25 C-38,-20 -55,-38 -60,-60 Z" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
    </g>

    <circle cx="0" cy="0" r="32" fill="url(#goldFiligree)"/>
    <circle cx="0" cy="0" r="26" fill="url(#pearlMini)"/>
    <circle cx="0" cy="0" r="14" fill="url(#kempRuby)" stroke="url(#goldFiligree)" stroke-width="2"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="url(#goldFiligree)" stroke-width="5" stroke-dasharray="3,5"/>
  </g>
</svg>
