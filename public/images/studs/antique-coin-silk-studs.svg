<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="coinBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FDF6EB"/>
      <stop offset="100%" stop-color="#EADBBE"/>
    </radialGradient>
    <linearGradient id="silkHaldi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5C00"/>
      <stop offset="40%" stop-color="#C68A04"/>
      <stop offset="70%" stop-color="#F2AF13"/>
      <stop offset="100%" stop-color="#A66F02"/>
    </linearGradient>
    <linearGradient id="antiqueGoldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#805B17"/>
      <stop offset="35%" stop-color="#D4A73F"/>
      <stop offset="55%" stop-color="#FFF0A8"/>
      <stop offset="80%" stop-color="#C79628"/>
      <stop offset="100%" stop-color="#694508"/>
    </linearGradient>
    <radialGradient id="studPearl" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F5EFE1"/>
      <stop offset="100%" stop-color="#CFC2A7"/>
    </radialGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#362506" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#coinBg)"/>
  <ellipse cx="400" cy="590" rx="280" ry="60" fill="#DFC8A0" opacity="0.35"/>

  <!-- Left Stud -->
  <g transform="translate(260, 390)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="105" fill="url(#silkHaldi)"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#DDA10C" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.6"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#A87503" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.6"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FFBF24" stroke-width="1.8" stroke-dasharray="4,2" opacity="0.6"/>

    <!-- Seed Pearl Halo -->
    <g>
      <circle cx="0" cy="-105" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="41" cy="-97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="74" cy="-74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="97" cy="-41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="105" cy="0" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="97" cy="41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="74" cy="74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="41" cy="97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="0" cy="105" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-41" cy="97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-74" cy="74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-97" cy="41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-105" cy="0" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-97" cy="-41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-74" cy="-74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-41" cy="-97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
    </g>

    <!-- Lakshmi Kasu Coin in Center -->
    <circle cx="0" cy="0" r="54" fill="url(#antiqueGoldCoin)" stroke="#694508" stroke-width="1"/>
    <!-- Coin Embossed Motifs -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFF0A8" stroke-width="1.5" stroke-dasharray="2,3"/>
    <!-- Goddess Lakshmi outline silhouette motif -->
    <circle cx="0" cy="-14" r="9" fill="#FFF0A8" opacity="0.9"/>
    <path d="M-18,12 C-18,-4 -8,-8 0,-8 C8,-8 18,-4 18,12 C10,22 -10,22 -18,12 Z" fill="#FFF0A8" opacity="0.85"/>
    <circle cx="-16" cy="-4" r="4" fill="#FFF0A8" opacity="0.9"/>
    <circle cx="16" cy="-4" r="4" fill="#FFF0A8" opacity="0.9"/>
    <!-- Lotus seat -->
    <path d="M-22,22 C-10,32 10,32 22,22 C14,26 -14,26 -22,22 Z" fill="#694508"/>
  </g>

  <!-- Right Stud -->
  <g transform="translate(540, 390)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="105" fill="url(#silkHaldi)"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#DDA10C" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.6"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#A87503" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.6"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FFBF24" stroke-width="1.8" stroke-dasharray="4,2" opacity="0.6"/>

    <g>
      <circle cx="0" cy="-105" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="41" cy="-97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="74" cy="-74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="97" cy="-41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="105" cy="0" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="97" cy="41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="74" cy="74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="41" cy="97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="0" cy="105" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-41" cy="97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-74" cy="74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-97" cy="41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-105" cy="0" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-97" cy="-41" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-74" cy="-74" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
      <circle cx="-41" cy="-97" r="8" fill="url(#studPearl)" stroke="url(#antiqueGoldCoin)" stroke-width="1"/>
    </g>

    <circle cx="0" cy="0" r="54" fill="url(#antiqueGoldCoin)" stroke="#694508" stroke-width="1"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFF0A8" stroke-width="1.5" stroke-dasharray="2,3"/>
    <circle cx="0" cy="-14" r="9" fill="#FFF0A8" opacity="0.9"/>
    <path d="M-18,12 C-18,-4 -8,-8 0,-8 C8,-8 18,-4 18,12 C10,22 -10,22 -18,12 Z" fill="#FFF0A8" opacity="0.85"/>
    <circle cx="-16" cy="-4" r="4" fill="#FFF0A8" opacity="0.9"/>
    <circle cx="16" cy="-4" r="4" fill="#FFF0A8" opacity="0.9"/>
    <path d="M-22,22 C-10,32 10,32 22,22 C14,26 -14,26 -22,22 Z" fill="#694508"/>
  </g>
</svg>
